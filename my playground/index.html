<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" ></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="w-100 overflow-auto bg-white shadow-sm">
            <table class="w-100 table rounded">
                <thead>
                    <tr>
                        <th class="text-secondary">ID</th>
                        <th class="text-secondary">Name</th>
                        <th class="text-secondary">Email</th>
                        <th class="text-secondary">Registration Date</th>
                        <th class="text-secondary">-</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="text-secondary">001</td>
                        <td>Aughus Frank Bueno</td>
                        <td>aughus@gmail.com</td>
                        <td class="text-secondary">01/01/2021</td>
                        <td>
                            <button class="btn btn-light btn-sm">
                                View
                            </button>
                            <button class="btn bg-main text-light btn-sm">
                                Approve
                            </button>
                            <button class="btn btn-danger btn-sm">
                                Reject
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- PAGINATION -->
            <div class="p-3">
                <div class="d-flex justify-content-center align-items-center">
                    <button class="fw-bolder me-2 badge rounded-pill btn bg-main">1</button>
                    <button class="fw-bolder me-2 badge rounded-pill btn text-dark">2</button>
                    <button class="fw-bolder me-2 badge rounded-pill btn text-dark">3</button>
                    <button class="fw-bolder me-2 badge rounded-pill btn text-dark">4</button>
                    <button class="fw-bolder me-2 badge rounded-pill btn text-dark">5</button>
                </div>
            </div>
        </div>
    </div>
    <script src="paginate.js"></script>
</body>
</html>
